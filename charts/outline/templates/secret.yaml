{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "outline.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outline.fullname" . }}-secret
  labels:
    {{- include "outline.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ if $existingSecret }}{{ index $existingSecret.data "SECRET_KEY" }}{{ else }}{{ randAlphaNum 32 | sha256sum | b64enc | quote }}{{ end }}
  UTILS_SECRET: {{ if $existingSecret }}{{ index $existingSecret.data "UTILS_SECRET" }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
stringData:
  {{- if and .Values.outline.oidc.clientId .Values.outline.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.outline.oidc.clientSecret | quote }}
  {{- end }}
  {{- if and .Values.outline.smtp.enabled .Values.outline.smtp.password }}
  SMTP_PASSWORD: {{ .Values.outline.smtp.password | quote }}
  {{- end }}
